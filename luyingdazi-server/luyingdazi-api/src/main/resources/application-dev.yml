spring:
  datasource:
    url: jdbc:mysql://localhost:3306/luyingdazi?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:root123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 15
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 5000

  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2
          max-wait: 3000ms

wx:
  miniapp:
    app-id: ${WX_APP_ID:your_app_id}
    app-secret: ${WX_APP_SECRET:your_app_secret}

aliyun:
  oss:
    endpoint: oss-cn-beijing.aliyuncs.com
    access-key-id: ${OSS_AK_ID:your_ak_id}
    access-key-secret: ${OSS_AK_SECRET:your_ak_secret}
    bucket-name: luyingdazi

app:
  token:
    secret: ${TOKEN_SECRET:luyingdazi_dev_secret_key}
    expire-seconds: 604800
