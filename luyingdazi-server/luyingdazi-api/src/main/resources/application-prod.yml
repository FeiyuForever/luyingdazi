spring:
  # 数据源（生产环境）
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/luyingdazi?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: luyingdazi
    password: ${DB_PASSWORD}
    hikari:
      minimum-idle: 3
      maximum-pool-size: 10
      idle-timeout: 30000
      max-lifetime: 1800000

  # Redis（生产环境）
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: ${REDIS_PASSWORD}
      database: 0
      lettuce:
        pool:
          max-active: 15
          max-idle: 8
          min-idle: 2

# 微信小程序配置
wx:
  miniapp:
    app-id: ${WX_APP_ID}
    app-secret: ${WX_APP_SECRET}

# 阿里云 OSS
aliyun:
  oss:
    endpoint: oss-cn-shanghai.aliyuncs.com
    access-key-id: ${OSS_ACCESS_KEY_ID}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET}
    bucket-name: ${OSS_BUCKET_NAME}

# 应用配置
app:
  token:
    secret: ${TOKEN_SECRET}
    expire-seconds: 604800

# 生产环境关闭SQL日志
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

logging:
  level:
    com.luyingdazi: info
    root: warn
