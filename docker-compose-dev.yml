# 本地开发环境：MySQL + Redis
# 启动：docker compose -f docker-compose-dev.yml up -d
# 停止：docker compose -f docker-compose-dev.yml down
# 清除数据：docker compose -f docker-compose-dev.yml down -v

version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: lyd-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: luyingdazi
      TZ: Asia/Shanghai
    volumes:
      - lyd_mysql_data:/var/lib/mysql
      - ./doc/sql/init_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: lyd-redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - lyd_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  lyd_mysql_data:
  lyd_redis_data:
